<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=BBH+Sans+Bartle&family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <title>Document</title>
    <style>
      body {
        background-color: hsl(212, 45%, 89%);
        font-family: "Outfit", sans-serif;
        font-optical-sizing: auto;
        font-weight: 400;
        font-style: normal;
        font-size: 15px;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        width: 100vw;
        overflow: hidden;
      }

      .card {
        width: 320px;
        box-sizing: border-box;
        background-color: white;
        border-radius: 20px;
        padding: 20px;
      }

      .imageContianer {
        width: 100%;
        box-sizing: border-box;
      }

      img {
        width: 100%;
        border-radius: 20px;
      }

      .textContianer {
        text-align: center;
      }

      h4 {
        font-size: 22px;
        font-weight: 700;
      }

      span {
        color: hsl(216, 15%, 48%);
        padding-bottom: 10px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="imageContianer">
        <img src="./image-qr-code.png" alt="qrcode" />
      </div>
      <div class="textContianer">
        <h4>Improve your front-end skills by building projects</h4>
        <span
          >Scan the QR code to visit Frontend Mentor and take your coding skills
          to the next level</span
        >
      </div>
    </div>
  </body>
</html>
